<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default-layout}">
<head>
    <title>고객 관리</title>
    <link rel="stylesheet" th:href="@{/css/pages/customers.css}">
</head>
<main layout:fragment="content" class="page page--fill">
    <link rel="stylesheet" th:href="@{/css/pages/customers.css}">

    <div class="customer-page">
        <div class="customer-stats-row">
            <div class="ds-stat-card">
                <span class="ds-stat-card__label">전체 고객</span>
                <strong id="statTotal" class="ds-stat-card__value">0명</strong>
            </div>
            <div class="ds-stat-card">
                <span class="ds-stat-card__label">일반 고객</span>
                <strong id="statRegular" class="ds-stat-card__value">0명</strong>
            </div>
            <div class="ds-stat-card">
                <span class="ds-stat-card__label">신규 고객</span>
                <strong id="statNew" class="ds-stat-card__value">0명</strong>
            </div>
            <div class="ds-stat-card">
                <span class="ds-stat-card__label">휴면 고객</span>
                <strong id="statDormant" class="ds-stat-card__value">0명</strong>
            </div>
        </div>

        <div class="selector-layout customer-selector">
            <aside id="customerTagPanel" class="selector-filter-panel">
                <div class="selector-panel-section">
                    <div class="selector-panel-header">
                        <h3 class="selector-panel-title">태그 선택</h3>
                        <button type="button" id="btnResetTags" class="ds-button ds-button--ghost ds-button--sm">초기화</button>
                    </div>
                </div>

                <div class="selector-panel-section">
                    <h4 class="selector-section-title">조건</h4>
                    <div class="ds-button-group">
                        <button type="button" id="btnConditionOr" class="ds-button ds-button--outline active">하나라도 해당</button>
                        <button type="button" id="btnConditionAnd" class="ds-button ds-button--outline">모두 해당</button>
                    </div>
                </div>

                <div id="customerTagFilters" class="selector-tag-scroll"></div>
            </aside>

            <section class="selector-main-panel">
                <div class="selector-header-row">
                    <div class="tab-container">
                        <button type="button" id="tabMembersBtn" class="tab-button active" onclick="switchTab('members')">고객 목록</button>
                        <button type="button" id="tabRejectsBtn" class="tab-button" onclick="switchTab('rejects')">수신 거부 목록</button>
                    </div>

                    <div class="search-box flex-grow-1">
                        <input type="text" id="customerSearchInput" class="ds-input" placeholder="고객명 검색" autocomplete="off">
                    </div>

                    <select id="sortOrderSelect" class="ds-select customer-sort-select" onchange="changeSortOrder(this.value)">
                        <option value="latest">최신순</option>
                        <option value="name">이름순</option>
                        <option value="type">유형순</option>
                    </select>
                </div>

                <div class="selector-table-control-bar">
                    <div class="selector-table-control-left">
                        <span class="selector-result-text">검색 결과 <b><span id="lblCustomerCount">0</span></b>명</span>
                    </div>
                    <div class="selector-table-control-right">
                        <span id="selectedTagSummary" class="customer-tag-summary">태그 전체</span>
                    </div>
                </div>

                <div class="selector-table-container">
                    <table class="ds-table customer-table">
                        <thead id="tableHeader"></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>

                <div id="customerPagination" class="ds-pagination"></div>
            </section>
        </div>

        <div id="customerDetailModal" class="modal-overlay" onclick="closeModalOnBackdrop(event)">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title">고객 상세 정보</h3>
                    <button type="button" class="modal-close" onclick="closeDetailModal()">×</button>
                </div>
                <div class="modal-body" id="modalBodyContent"></div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/pages/customers.js}"></script>
</main>
</html>
