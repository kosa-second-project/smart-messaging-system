<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default-layout}">
<head>
    <title>비용 분석</title>
    <link rel="stylesheet" th:href="@{/css/pages/stats/analysis.css}">
</head>
<main layout:fragment="content" class="page stats-overview-page">
    <div id="statsAnalysisPage" class="stats-overview" data-analysis-page="cost">
        <section class="stats-top">
            <form id="statsPeriodForm" class="stats-period-control" aria-label="비용 분석 조회 기간">
                <div class="stats-period-control__label">
                    <svg class="stats-icon stats-icon--primary" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"></path>
                    </svg>
                    <span>기간</span>
                </div>
                <input id="statsStartDate" class="stats-period-control__input" type="date" value="2026-06-23">
                <span class="stats-period-control__separator">~</span>
                <input id="statsEndDate" class="stats-period-control__input" type="date" value="2026-06-29">
                <span class="stats-period-control__badge">청구 기준</span>
                <span id="statsPeriodLabel" class="stats-period-control__summary">2026-06-23 ~ 2026-06-29 (7일)</span>
            </form>

            <div class="stats-actions">
                <button type="button" class="stats-button stats-button--outline" disabled title="PDF 다운로드">
                    <svg class="stats-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <path d="M7 10l5 5 5-5"></path>
                        <path d="M12 15V3"></path>
                    </svg>
                    PDF 다운로드
                </button>
                <button type="button" class="stats-button stats-button--outline" disabled title="Excel 다운로드">
                    <svg class="stats-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <path d="M7 10l5 5 5-5"></path>
                        <path d="M12 15V3"></path>
                    </svg>
                    Excel 다운로드
                </button>
            </div>
        </section>

        <section id="statsCards" class="stats-card-grid stats-card-grid--4" aria-label="비용 분석 주요 지표"></section>

        <section class="stats-analysis-grid">
            <article class="stats-card stats-analysis-card stats-analysis-card--primary">
                <div class="stats-analysis-card__head">
                    <h3 id="analysisPrimaryTitle" class="stats-card-title"></h3>
                    <span id="analysisPrimaryMeta" class="stats-analysis-card__meta"></span>
                </div>
                <div class="stats-canvas-wrap">
                    <canvas id="analysisPrimaryChart" height="260"></canvas>
                </div>
            </article>

            <article class="stats-card stats-analysis-card stats-analysis-card--primary">
                <div class="stats-analysis-card__head">
                    <h3 id="analysisSecondaryTitle" class="stats-card-title"></h3>
                    <span id="analysisSecondaryMeta" class="stats-analysis-card__meta"></span>
                </div>
                <div class="stats-canvas-wrap">
                    <canvas id="analysisSecondaryChart" height="260"></canvas>
                </div>
            </article>
        </section>
    </div>

    <script th:src="@{/js/pages/stats/cost.js}"></script>
</main>
</html>
