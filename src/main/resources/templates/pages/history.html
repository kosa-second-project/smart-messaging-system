<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default-layout}">
<head>
    <title>전송 기록</title>
</head>
<main layout:fragment="content" class="page history-page">
    <form id="historySearchForm" class="history-filter" method="get" th:action="@{/history}"
          th:object="${searchCondition}">
        <div class="history-filter__controls">
            <label class="history-search">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <span class="visually-hidden">전송 기록 검색</span>
                <input class="ds-input" type="search" th:field="*{keyword}"
                       placeholder="제목, 내용, 태그 검색..." autocomplete="off">
            </label>

            <label class="history-filter__select">
                <span class="visually-hidden">채널</span>
                <select class="ds-select" th:field="*{channelId}" data-auto-submit>
                    <option value="">전체 채널</option>
                    <option th:each="channel : ${channels}" th:value="${channel.id}" th:text="${channel.label}"></option>
                </select>
            </label>

            <label class="history-filter__select">
                <span class="visually-hidden">상태</span>
                <select class="ds-select" th:field="*{status}" data-auto-submit>
                    <option value="">전체 상태</option>
                    <option th:each="statusOption : ${statuses}"
                            th:value="${statusOption.value}"
                            th:text="${statusOption.label}"></option>
                </select>
            </label>

            <label class="history-filter__select">
                <span class="visually-hidden">광고 여부</span>
                <select class="ds-select" th:field="*{purpose}" data-auto-submit>
                    <option value="">전체 광고여부</option>
                    <option th:each="purposeOption : ${purposes}"
                            th:value="${purposeOption}"
                            th:text="${#strings.equalsIgnoreCase(purposeOption, 'INFO') ? '정보성' : (#strings.equalsIgnoreCase(purposeOption, 'AD') ? '광고성' : purposeOption)}"></option>
                </select>
            </label>

            <label class="history-filter__sort">
                <span class="visually-hidden">정렬 기준</span>
                <select class="ds-select" th:field="*{sort}" data-auto-submit>
                    <option value="latest">최신순</option>
                    <option value="oldest">오래된순</option>
                    <option value="mostSent">발송많은순</option>
                    <option value="highestSuccessRate">성공률높은순</option>
                </select>
            </label>

            <div class="history-filter__period" aria-label="발송 기간">
                <label>
                    <span class="visually-hidden">시작일</span>
                    <input class="ds-input" type="date" th:field="*{startDate}">
                </label>
                <span aria-hidden="true">~</span>
                <label>
                    <span class="visually-hidden">종료일</span>
                    <input class="ds-input" type="date" th:field="*{endDate}">
                </label>
            </div>

            <button class="ds-button ds-button--primary history-filter__submit" type="submit">조회</button>
            <a class="ds-button ds-button--ghost" th:href="@{/history}">초기화</a>
        </div>

        <div class="history-tags" aria-label="태그 필터">
            <a class="history-tag"
               th:classappend="${searchCondition.tagIds.isEmpty()} ? ' is-active'"
               th:href="@{/history(keyword=${searchCondition.keyword},channelId=${searchCondition.channelId},status=${searchCondition.status},purpose=${searchCondition.purpose},startDate=${searchCondition.startDate},endDate=${searchCondition.endDate},sort=${searchCondition.sort},page=1)}">전체</a>
            <label class="history-tag" th:each="tag : ${tags}"
                   th:classappend="${#lists.contains(searchCondition.tagIds, tag.id)} ? ' is-active'">
                <input class="history-tag__input" type="checkbox" th:field="*{tagIds}"
                       th:value="${tag.id}" data-tag-submit>
                <span th:text="${tag.label}">태그</span>
            </label>
        </div>
    </form>

    <section class="table-panel history-table" aria-label="전송 기록 목록">
        <div class="table-scroll">
            <table class="ds-table">
                <thead>
                <tr>
                    <th>발송일시</th>
                    <th>제목</th>
                    <th>채널</th>
                    <th>광고여부</th>
                    <th>태그</th>
                    <th class="history-table__number">발송</th>
                    <th class="history-table__number">성공</th>
                    <th class="history-table__number">실패</th>
                    <th class="history-table__number">성공률</th>
                    <th class="history-table__number">절감 비용</th>
                    <th>상태</th>
                </tr>
                </thead>
                <tbody>
                <tr class="history-table__row"
                    th:each="history : ${historyPage.content}"
                    th:attr="data-history-id=${history.id},aria-label=${history.title ?: '전송 기록 상세 보기'}"
                    role="button"
                    tabindex="0">
                    <td class="history-table__date"
                        th:text="${history.scheduledAt == null ? '-' : #temporals.format(history.scheduledAt, 'yyyy.MM.dd HH:mm')}">-</td>
                    <td class="history-table__title" th:text="${history.title ?: '-'}">-</td>
                    <td>
                        <div class="history-badges" th:if="${!history.channels.isEmpty()}">
                            <span class="ds-badge ds-badge--primary" th:each="channel : ${history.channels}" th:text="${channel}">채널</span>
                        </div>
                        <span th:if="${history.channels.isEmpty()}">-</span>
                    </td>
                    <td><span class="ds-badge" th:text="${history.purposeLabel}">-</span></td>
                    <td>
                        <div class="history-badges" th:if="${!history.tags.isEmpty()}">
                            <span class="ds-badge history-tag-badge" th:each="tag : ${history.displayTags}" th:text="${tag}">태그</span>
                            <span class="ds-badge history-tag-count" th:if="${history.hiddenTagCount > 0}"
                                  th:text="'+' + ${history.hiddenTagCount}">+1</span>
                        </div>
                        <span th:if="${history.tags.isEmpty()}">-</span>
                    </td>
                    <td class="history-table__number" th:text="${#numbers.formatInteger(history.totalTargetCount, 1, 'COMMA')}">0</td>
                    <td class="history-table__number history-table__success" th:text="${#numbers.formatInteger(history.successCount, 1, 'COMMA')}">0</td>
                    <td class="history-table__number history-table__fail" th:text="${#numbers.formatInteger(history.failCount, 1, 'COMMA')}">0</td>
                    <td class="history-table__number" th:text="${history.displaySuccessRate} + '%'">0.0%</td>
                    <td class="history-table__number"
                        th:text="${history.estimatedSaving == null ? '-' : '₩' + #numbers.formatDecimal(history.estimatedSaving, 1, 'COMMA', 0, 'POINT')}">-</td>
                    <td><span class="ds-badge history-status"
                              th:classappend="${history.statusStyleClass}"
                              th:text="${history.statusLabel}">-</span></td>
                </tr>
                <tr th:if="${historyPage.empty}">
                    <td class="history-empty" colspan="11">
                        <strong>조회된 전송 기록이 없습니다.</strong>
                        <span>검색어나 필터 조건을 변경해 보세요.</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <nav class="ds-pagination" th:if="${historyPage.totalPages > 0}" aria-label="전송 기록 페이지">
            <span class="ds-pagination__summary"
                  th:text="'총 ' + ${#numbers.formatInteger(historyPage.totalElements, 1, 'COMMA')} + '건 중 ' + ${historyPage.startElement} + '-' + ${historyPage.endElement}">총 40건 중 1-10</span>
            <div class="ds-pagination__pages">
                <a class="ds-page-button" th:if="${historyPage.hasPrevious}" aria-label="이전 페이지"
                   th:href="@{/history(keyword=${searchCondition.keyword},channelId=${searchCondition.channelId},status=${searchCondition.status},purpose=${searchCondition.purpose},tagIds=${searchCondition.tagIds},startDate=${searchCondition.startDate},endDate=${searchCondition.endDate},sort=${searchCondition.sort},page=${historyPage.currentPage - 1})}">‹</a>
                <span class="ds-page-button is-disabled" th:unless="${historyPage.hasPrevious}" aria-hidden="true">‹</span>

                <a class="ds-page-button" th:each="pageNumber : ${#numbers.sequence(historyPage.startPage, historyPage.endPage)}"
                   th:classappend="${pageNumber == historyPage.currentPage} ? ' is-active'"
                   th:text="${pageNumber}"
                   th:aria-current="${pageNumber == historyPage.currentPage} ? 'page'"
                   th:href="@{/history(keyword=${searchCondition.keyword},channelId=${searchCondition.channelId},status=${searchCondition.status},purpose=${searchCondition.purpose},tagIds=${searchCondition.tagIds},startDate=${searchCondition.startDate},endDate=${searchCondition.endDate},sort=${searchCondition.sort},page=${pageNumber})}">1</a>

                <a class="ds-page-button" th:if="${historyPage.hasNext}" aria-label="다음 페이지"
                   th:href="@{/history(keyword=${searchCondition.keyword},channelId=${searchCondition.channelId},status=${searchCondition.status},purpose=${searchCondition.purpose},tagIds=${searchCondition.tagIds},startDate=${searchCondition.startDate},endDate=${searchCondition.endDate},sort=${searchCondition.sort},page=${historyPage.currentPage + 1})}">›</a>
                <span class="ds-page-button is-disabled" th:unless="${historyPage.hasNext}" aria-hidden="true">›</span>
            </div>
        </nav>
    </section>

    <div id="historyDetailModal" class="history-modal" hidden>
        <div class="history-modal__backdrop" data-modal-close></div>
        <section class="history-modal__dialog" role="dialog" aria-modal="true"
                 aria-labelledby="historyModalHeading" tabindex="-1">
            <header class="history-modal__header">
                <h2 id="historyModalHeading">전송 기록 상세</h2>
                <button class="history-modal__close" type="button" data-modal-close aria-label="닫기">&times;</button>
            </header>

            <div class="history-modal__body">
                <div id="historyDetailLoading" class="history-modal__state" role="status">상세 정보를 불러오는 중입니다.</div>
                <div id="historyDetailError" class="history-modal__state history-modal__state--error" role="alert" hidden></div>

                <div id="historyDetailContent" hidden>
                    <section class="history-detail__hero">
                        <div class="history-detail__heading">
                            <h3 id="historyDetailTitle">-</h3>
                            <time id="historyDetailScheduledAt">-</time>
                        </div>
                        <div id="historyDetailBadges" class="history-detail__badges"></div>
                    </section>

                    <div class="history-detail__tags-line">
                        <span class="history-detail__label">태그</span>
                        <div id="historyDetailTags" class="history-detail__tags">-</div>
                    </div>

                    <section class="history-detail__summary" aria-label="전송 요약">
                        <article class="history-summary-card">
                            <span>총발송</span><strong id="historyDetailTotalCount">0건</strong>
                        </article>
                        <article class="history-summary-card history-summary-card--success">
                            <span>성공</span><strong id="historyDetailSuccessCount">0건</strong>
                        </article>
                        <article class="history-summary-card history-summary-card--fail">
                            <span>실패</span><strong id="historyDetailFailCount">0건</strong>
                        </article>
                        <article class="history-summary-card">
                            <span>총소요비용</span><strong id="historyDetailActualCost">0원</strong>
                        </article>
                        <article class="history-summary-card">
                            <span>절감액</span><strong id="historyDetailSaving">0원</strong>
                        </article>
                        <article class="history-summary-card">
                            <span>최종도달률</span><strong id="historyDetailSuccessRate">0.0%</strong>
                        </article>
                    </section>

                    <div class="history-detail__actions">
                        <button id="historyRetryButton" class="ds-button ds-button--ghost history-retry-button" type="button">
                            <svg class="history-retry-button__icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7"></path>
                            </svg>
                            <span class="history-retry-button__label">실패 대상자에게 재발송</span>
                        </button>
                    </div>

                    <section class="history-detail__section">
                        <h3>메시지 내용</h3>
                        <div id="historyDetailMessage" class="history-detail__message">-</div>
                    </section>

                    <section class="history-detail__section">
                        <h3>대체 발송 흐름</h3>
                        <div id="historyAttemptFlows" class="history-attempt-flows"></div>
                    </section>
                    <section id="historyRetryAvailabilitySection" class="history-detail__section history-retry-availability" hidden>
                        <h3>재발송 대상</h3>
                        <div class="history-retry-availability__grid">
                            <article class="history-retry-availability__item history-retry-availability__item--available">
                                <span>재발송 가능</span>
                                <strong id="historyRetryableFailCount">0건</strong>
                            </article>
                            <article class="history-retry-availability__item history-retry-availability__item--blocked">
                                <span>재발송 불가</span>
                                <strong id="historyUnretryableFailCount">0건</strong>
                            </article>
                        </div>
                        <p id="historyRetryAvailabilityMessage" class="history-retry-availability__message"></p>
                    </section>
                </div>
            </div>
        </section>
    </div>

    <script th:src="@{/js/pages/history.js}"></script>
</main>
</html>
