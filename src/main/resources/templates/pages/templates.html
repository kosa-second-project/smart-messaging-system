<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default-layout}">
<head>
    <title>템플릿 관리</title>
    <link rel="stylesheet" th:href="@{/css/pages/templates.css}">
</head>
<main layout:fragment="content" class="page">
    <link rel="stylesheet" th:href="@{/css/pages/templates.css}">

    <div class="template-page">
        <section class="template-stats" aria-label="템플릿 통계">
            <div class="template-stat-card">
                <span class="template-stat-card__label">전체 템플릿</span>
                <strong id="statTotalCount" class="template-stat-card__value">0개</strong>
            </div>
            <div class="template-stat-card">
                <span class="template-stat-card__label">AI 생성</span>
                <strong id="statAiCount" class="template-stat-card__value text-green">0개</strong>
            </div>
            <div class="template-stat-card">
                <span class="template-stat-card__label">카카오 승인</span>
                <strong id="statApprovedCount" class="template-stat-card__value text-kakao">0개</strong>
            </div>
            <div class="template-stat-card">
                <span class="template-stat-card__label">누적 사용</span>
                <strong id="statUseCount" class="template-stat-card__value text-blue">0회</strong>
            </div>
        </section>

        <section class="template-toolbar" aria-label="템플릿 검색 및 필터">
            <div class="template-toolbar__left">
                <div class="template-search">
                    <svg class="template-search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input id="templateKeywordInput" type="text" class="template-search__input" placeholder="제목, 내용, 목적 검색">
                </div>

                <select id="templateCategoryFilter" class="template-select">
                    <option value="">전체 카테고리</option>
                </select>

                <select id="templatePurposeFilter" class="template-select">
                    <option value="">전체 목적</option>
                </select>

                <select id="templateChannelFilter" class="template-select">
                    <option value="">전체 채널</option>
                </select>
            </div>

            <div class="template-toolbar__right">
                <select id="templateSortSelect" class="template-select">
                    <option value="latest">최근 수정순</option>
                    <option value="title">제목순</option>
                    <option value="useCount">사용 많은순</option>
                </select>
                <button type="button" class="ds-button ds-button--primary template-create-button" onclick="openTemplateModal()">
                    <svg class="template-button-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 5v14"></path>
                        <path d="M5 12h14"></path>
                    </svg>
                    새 템플릿
                </button>
            </div>
        </section>

        <section class="template-table-card">
            <div class="template-table-scroll">
                <table class="template-table">
                    <thead>
                    <tr>
                        <th>템플릿</th>
                        <th>카테고리</th>
                        <th>목적</th>
                        <th>채널</th>
                        <th>카카오 상태</th>
                        <th>사용</th>
                        <th>수정일</th>
                        <th class="template-table__actions">관리</th>
                    </tr>
                    </thead>
                    <tbody id="templateTableBody">
                    <tr>
                        <td colspan="8" class="template-empty-cell">데이터를 불러오는 중입니다...</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="template-pagination">
                <span id="templatePageInfo">불러오는 중...</span>
                <div id="templatePaginationButtons" class="template-pagination__buttons"></div>
            </div>
        </section>

        <div id="templateModal" class="template-modal-overlay" onclick="closeTemplateModalOnBackdrop(event)">
            <div class="template-modal">
                <div class="template-modal__header">
                    <h3 id="templateModalTitle" class="template-modal__title">템플릿 등록</h3>
                    <button type="button" class="template-modal__close" onclick="closeTemplateModal()" aria-label="닫기">×</button>
                </div>

                <form id="templateForm" class="template-form">
                    <input type="hidden" id="templateId">

                    <div class="template-form-grid">
                        <label class="template-field">
                            <span class="template-field__label">제목</span>
                            <input id="templateTitle" type="text" class="template-input" maxlength="120" required>
                        </label>

                        <label class="template-field">
                            <span class="template-field__label">카테고리</span>
                            <input id="templateCategory" type="text" class="template-input" maxlength="50" placeholder="예: 프로모션">
                        </label>

                        <label class="template-field">
                            <span class="template-field__label">목적</span>
                            <input id="templatePurpose" type="text" class="template-input" maxlength="80" placeholder="예: 재구매 유도">
                        </label>

                        <label class="template-field">
                            <span class="template-field__label">카카오 상태</span>
                            <select id="templateKakaoStatus" class="template-input">
                                <option value="PENDING">대기</option>
                                <option value="APPROVED">승인</option>
                                <option value="REJECTED">반려</option>
                            </select>
                        </label>

                        <label class="template-field template-field--wide">
                            <span class="template-field__label">카카오 템플릿 코드</span>
                            <input id="templateKakaoCode" type="text" class="template-input" maxlength="100">
                        </label>

                        <div class="template-field template-field--wide">
                            <span class="template-field__label">채널</span>
                            <div id="templateChannelCheckboxes" class="template-channel-list"></div>
                        </div>

                        <label class="template-field template-field--wide template-checkbox-row">
                            <input id="templateAiGenerated" type="checkbox">
                            <span>AI 생성 템플릿</span>
                        </label>

                        <label class="template-field template-field--wide">
                            <span class="template-field__label">내용</span>
                            <textarea id="templateContent" class="template-textarea" rows="8" maxlength="2000" required></textarea>
                        </label>
                    </div>

                    <div class="template-modal__footer">
                        <button type="button" id="templateDeleteButton" class="ds-button ds-button--danger" onclick="deleteCurrentTemplate()">삭제</button>
                        <div class="template-modal__footer-right">
                            <button type="button" class="ds-button ds-button--outline" onclick="closeTemplateModal()">취소</button>
                            <button type="submit" class="ds-button ds-button--primary">저장</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script th:src="@{/js/pages/templates.js}"></script>
</main>
</html>
