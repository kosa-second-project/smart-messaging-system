spring:
  application:
    name: smart-messaging-system
  
  # 기본 프로필을 local로 지정 (로컬 개발용)
  profiles:
    active: local

  # 공통 Thymeleaf 설정
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

  # 정적 리소스 캐시 버스팅(Cache Busting) 설정: CSS/JS 수정 시 브라우저 캐시 자동 갱신
  web:
    resources:
      chain:
        strategy:
          content:
            enabled: true
            paths: /**

# MyBatis 공통 설정
mybatis:
  mapper-locations: classpath:mappers/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080
