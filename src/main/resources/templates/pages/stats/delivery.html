<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default-layout}">
<head>
    <title>발송 현황</title>
    <link rel="stylesheet" th:href="@{/css/pages/stats/delivery.css}">
</head>
<main layout:fragment="content" class="page stats-overview-page">
    <div class="stats-overview">
        <section class="stats-top">
            <form id="statsPeriodForm" class="stats-period-control" aria-label="통계 조회 기간">
                <div class="stats-period-control__label">
                    <svg class="stats-icon stats-icon--primary" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"></path>
                    </svg>
                    <span>기간</span>
                </div>
                <input id="statsStartDate" class="stats-period-control__input" type="date">
                <span class="stats-period-control__separator">~</span>
                <input id="statsEndDate" class="stats-period-control__input" type="date">
                <span class="stats-period-control__badge">집계 기준</span>
                <span id="statsPeriodLabel" class="stats-period-control__summary"></span>
            </form>

            <div class="stats-actions">
                <button type="button" class="stats-button stats-button--outline" disabled title="PDF 다운로드">
                    <svg class="stats-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <path d="M7 10l5 5 5-5"></path>
                        <path d="M12 15V3"></path>
                    </svg>
                    PDF 다운로드
                </button>
                <button type="button" class="stats-button stats-button--outline" disabled title="Excel 다운로드">
                    <svg class="stats-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <path d="M7 10l5 5 5-5"></path>
                        <path d="M12 15V3"></path>
                    </svg>
                    Excel 다운로드
                </button>
            </div>
        </section>

        <section id="statsCards" class="stats-card-grid" aria-label="발송 현황 주요 지표"></section>

        <th:block th:replace="~{fragments/realtime-queue-status :: card}"></th:block>

        <section class="stats-chart-layout">
            <article class="stats-card stats-chart-card stats-chart-card--large">
                <h3 class="stats-card-title">채널별 발송 현황</h3>
                <div class="stats-canvas-wrap">
                    <canvas id="channelTrendChart" height="240"></canvas>
                </div>
            </article>

            <div class="stats-chart-stack">
                <article class="stats-card stats-chart-card">
                    <h3 class="stats-card-title">발송 &amp; 성공 추이</h3>
                    <div class="stats-canvas-wrap">
                        <canvas id="sendTrendChart" height="240"></canvas>
                    </div>
                </article>

                <article class="stats-card stats-chart-card">
                    <div class="stats-chart-card__head">
                        <h3 class="stats-card-title">Fallback 채널별 성공률</h3>
                        <span class="stats-badge">집계 기준</span>
                    </div>
                    <div class="stats-canvas-wrap">
                        <canvas id="fallbackChart" height="240"></canvas>
                    </div>
                </article>
            </div>
        </section>
    </div>

    <script th:src="@{/js/components/realtime-queue-status.js}"></script>
    <script th:src="@{/js/pages/stats/delivery.js}"></script>
</main>
</html>
