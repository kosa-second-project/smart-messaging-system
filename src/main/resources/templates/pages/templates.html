<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default-layout}">
<head>
    <title>템플릿 관리</title>
    <link rel="stylesheet" th:href="@{/css/pages/templates.css}">
</head>
<main layout:fragment="content" class="page">
    <link rel="stylesheet" th:href="@{/css/pages/templates.css}">

    <div class="template-page">
        <section class="template-toolbar ds-filter-panel" aria-label="템플릿 검색 및 필터">
            <div class="template-toolbar__filters ds-filter-row">
                <div class="template-search ds-filter-search">
                    <svg class="template-search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input id="templateKeywordInput" type="text" class="ds-input template-search__input" placeholder="템플릿명, 내용, 카테고리 검색...">
                </div>

                <div id="templateCategoryFilter" class="ds-multiselect" data-multiselect data-placeholder="전체 카테고리">
                    <button type="button" class="ds-multiselect__trigger" data-multiselect-trigger>
                        <span class="ds-multiselect__label" data-multiselect-label>전체 카테고리</span>
                    </button>
                    <div class="ds-multiselect__menu" data-multiselect-menu></div>
                </div>

                <div id="templateChannelFilter" class="ds-multiselect" data-multiselect data-placeholder="전체 채널">
                    <button type="button" class="ds-multiselect__trigger" data-multiselect-trigger>
                        <span class="ds-multiselect__label" data-multiselect-label>전체 채널</span>
                    </button>
                    <div class="ds-multiselect__menu" data-multiselect-menu></div>
                </div>

                <div id="templatePurposeFilter" class="ds-multiselect" data-multiselect data-placeholder="전체 광고여부">
                    <button type="button" class="ds-multiselect__trigger" data-multiselect-trigger>
                        <span class="ds-multiselect__label" data-multiselect-label>전체 광고여부</span>
                    </button>
                    <div class="ds-multiselect__menu" data-multiselect-menu></div>
                </div>

                <select id="templateSortSelect" class="ds-select template-filter-select">
                    <option value="recentModified">최근 수정순</option>
                    <option value="title">이름순</option>
                    <option value="useCount">사용 많은순</option>
                </select>
            </div>

            <button type="button" class="ds-button ds-button--primary" onclick="openAddTemplateModal()">
                <svg class="template-button-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M12 5v14"></path>
                    <path d="M5 12h14"></path>
                </svg>
                템플릿 추가
            </button>
        </section>

        <section class="table-panel template-table-panel">
            <div id="templateMobileList" class="template-mobile-list"></div>

            <div class="table-scroll template-desktop-table">
                <table class="ds-table template-table">
                    <thead>
                    <tr>
                        <th>템플릿명</th>
                        <th class="template-col-lg">카테고리</th>
                        <th>광고여부</th>
                        <th>채널</th>
                        <th class="template-col-lg">사용 횟수</th>
                        <th>최근 수정</th>
                    </tr>
                    </thead>
                    <tbody id="templateTableBody">
                    <tr>
                        <td colspan="6" class="template-empty-cell">데이터를 불러오는 중입니다...</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div id="templatePagination" class="ds-pagination"></div>
        </section>

        <div id="templateDetailModal" class="ds-modal" onclick="closeTemplateDetailOnBackdrop(event)">
            <div class="ds-modal__backdrop"></div>
            <div class="ds-modal__panel template-detail-modal">
                <div class="ds-modal__header">
                    <h3 class="ds-modal__title">템플릿 상세</h3>
                    <button type="button" class="ds-icon-button" onclick="closeTemplateDetailModal()" aria-label="닫기">×</button>
                </div>
                <div id="templateDetailBody" class="ds-modal__body"></div>
            </div>
        </div>

        <div id="templateAddModal" class="ds-modal" onclick="closeAddTemplateOnBackdrop(event)">
            <div class="ds-modal__backdrop"></div>
            <div class="ds-modal__panel template-add-modal">
                <div class="ds-modal__header">
                    <h3 class="ds-modal__title">새 템플릿 추가</h3>
                    <button type="button" class="ds-icon-button" onclick="closeAddTemplateModal()" aria-label="닫기">×</button>
                </div>

                <form id="templateForm">
                    <div class="ds-modal__body">
                        <div class="template-modal-layout template-modal-layout--form">
                            <section class="template-modal-main template-form-fields">
                                <label class="ds-field">
                                    <span class="ds-label">템플릿명</span>
                                    <input id="templateTitle" type="text" class="ds-input" maxlength="120" required>
                                </label>

                                <div class="template-form-grid">
                                    <div class="ds-field">
                                        <span class="ds-label">채널</span>
                                        <div id="templateChannelCheckboxes" class="template-channel-grid"></div>
                                    </div>

                                    <label class="ds-field">
                                        <span class="ds-label">카테고리</span>
                                        <select id="templateCategory" class="ds-select" required>
                                            <option value="">카테고리 선택</option>
                                        </select>
                                    </label>
                                </div>

                                <div class="template-form-grid">
                                    <label class="ds-field">
                                        <span class="ds-label">광고여부</span>
                                        <input id="templatePurpose" type="hidden" value="AD">
                                        <div class="template-purpose-grid" role="group" aria-label="광고여부">
                                            <button type="button" class="template-purpose-option is-active" data-purpose-value="AD">광고성</button>
                                            <button type="button" class="template-purpose-option" data-purpose-value="INFO">정보성</button>
                                        </div>
                                    </label>
                                </div>

                                <label class="ds-field">
                                    <span class="template-content-label">
                                        <span class="ds-label">메시지 내용</span>
                                        <button id="templateAiPanelButton" type="button" class="ds-button template-ai-open-button">
                                            AI 문구 추천
                                        </button>
                                    </span>
                                    <textarea id="templateContent" class="ds-textarea template-content-input" rows="8" maxlength="2000" required></textarea>
                                    <span id="templateContentCount" class="ds-help">0 / 최대 1000byte</span>
                                </label>

                            </section>

                            <aside class="template-modal-aside" id="templateSidePanel">
                                <div id="templatePreviewPanel" class="template-preview-panel">
                                    <div class="template-panel-header">
                                        <span>미리보기</span>
                                        <div class="ds-segment">
                                            <button type="button" class="ds-segment__item is-active" data-preview-mode="message">메시지</button>
                                            <button type="button" class="ds-segment__item" data-preview-mode="kakao">카카오톡</button>
                                            <button type="button" class="ds-segment__item" data-preview-mode="email">이메일</button>
                                        </div>
                                    </div>
                                    <div id="templateFormPreview"></div>
                                </div>
                            </aside>
                        </div>
                    </div>

                    <div class="ds-modal__footer">
                        <button type="button" class="ds-button ds-button--outline" onclick="closeAddTemplateModal()">취소</button>
                        <button id="templateReviewButton" type="button" class="ds-button template-review-action-button">AI 검사</button>
                        <button id="templateSaveButton" type="submit" class="ds-button ds-button--primary" disabled>저장</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="templateAiModal" class="ds-modal template-assistant-modal" onclick="closeTemplateAiOnBackdrop(event)">
            <div class="ds-modal__backdrop"></div>
            <div class="ds-modal__panel">
                <div class="ds-modal__header">
                    <h3 class="ds-modal__title">AI 문구 추천</h3>
                    <button id="templateAiPanelClose" type="button" class="ds-icon-button" onclick="closeTemplateAiPanel()" aria-label="닫기">×</button>
                </div>
                <div class="ds-modal__body">
                    <div id="templateAiPanel" class="template-ai-panel" hidden>
                        <label class="ds-field">
                            <span class="ds-label">원하는 문구 방향</span>
                            <textarea id="templateAiDirection" class="ds-textarea" rows="4" maxlength="500" placeholder="예: 신규 고객에게 여름 쿠폰을 친근하지만 과장되지 않게 안내해 주세요."></textarea>
                        </label>
                        <button id="templateAiGenerateButton" type="button" class="ds-button ds-button--primary template-ai-generate-button">추천 문구 생성</button>
                        <div id="templateAiMessage" class="template-inline-message" aria-live="polite"></div>
                        <div id="templateAiSuggestions" class="template-ai-suggestions"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="templateReviewModal" class="ds-modal template-assistant-modal template-review-modal" onclick="closeTemplateReviewOnBackdrop(event)">
            <div class="ds-modal__backdrop"></div>
            <div class="ds-modal__panel">
                <div class="ds-modal__header">
                    <h3 class="ds-modal__title">AI 검사 결과</h3>
                    <button type="button" class="ds-icon-button" onclick="closeTemplateReviewModal()" aria-label="닫기">×</button>
                </div>
                <div class="ds-modal__body">
                    <section id="templateReviewPanel" class="template-review-panel" hidden aria-live="polite">
                        <div id="templateReviewResult"></div>
                        <label id="templateReviewAcknowledgeRow" class="template-review-acknowledge" hidden>
                            <input id="templateReviewAcknowledge" type="checkbox">
                            <span>검사 결과를 확인했으며 이 상태로 저장합니다.</span>
                        </label>
                    </section>
                </div>
            </div>
        </div>
    </div>

    <template id="messagePreviewComponentTemplate">
        <div th:replace="~{fragments/components/message-preview :: preview}"></div>
    </template>

    <script th:src="@{/js/pages/templates.js}"></script>
</main>
</html>
