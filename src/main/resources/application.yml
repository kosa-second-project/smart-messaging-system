spring:
  application:
    name: smart-messaging-system

  # 기본 프로필을 local로 지정 (로컬 개발용)
  profiles:
    active: local

  # 공통 Thymeleaf 설정
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

  # 정적 리소스 캐시 버스팅(Cache Busting) 설정: CSS/JS 수정 시 브라우저 캐시 자동 갱신
  web:
    resources:
      chain:
        strategy:
          content:
            enabled: true
            paths: /**
  ai:
    # 문맥 검사는 실패 시 서버 룰 결과로 대체하므로 장시간 재시도하지 않는다.
    retry:
      max-attempts: 1
    model:
      chat: google-genai
    google:
      genai:
        chat:
          options:
            model: gemini-2.5-flash
        embedding:
          options:
            model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
            output-dimensionality: ${GEMINI_EMBEDDING_DIMENSIONS:3072}
            batch-size: ${GEMINI_EMBEDDING_BATCH_SIZE:5}
            max-attempts: ${GEMINI_EMBEDDING_MAX_ATTEMPTS:2}
    # VectorDB Qdrant 설정
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_PORT:6334}
        api-key: ${QDRANT_API_KEY:}
        collection-name: ${QDRANT_COLLECTION_NAME:smart-message-rag}
        use-tls: ${QDRANT_USE_TLS:false}
        initialize-schema: true

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

stats:
  batch:
    cron: "0 0 3 * * *"
    zone: Asia/Seoul
    system-user-id: 0

# MyBatis 공통 설정
mybatis:
  mapper-locations: classpath:mappers/**/*.xml
  type-aliases-package: com.example.smartmessaging.dto   # dto 하위의 모든 패키지(vo, response, request) 자동 별칭 등록
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100

# 콘솔 로그 설정
logging:
  level:
    root: info
    com.example.smartmessaging.mapper: debug

server:
  port: 8080

openai:
  moderation:
    base-url: https://api.openai.com
    api-key:
    model: omni-moderation-latest
    enabled: true

app:
  base-url: http://localhost:8080
  short-url-base-url: https://kosa.kr
  dummy-send:
    enabled: false

aws:
  ses:
    enabled: false
    region: ap-northeast-2
    from-email: ""
    from-name: "Smart Messaging"

solapi:
  enabled: false
  api-key: ${SOLAPI_API_KEY:}
  api-secret: ${SOLAPI_API_SECRET:}
  from-number: ${SOLAPI_FROM_NUMBER:}

rag:
  seed:
    path: classpath:rag-seed/marketing-rag.jsonl
    auto-ingest: false
  search:
    top-k: 5
