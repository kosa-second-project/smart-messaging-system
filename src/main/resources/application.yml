spring:
  application:
    name: smart-messaging-system

  profiles:
    active: local

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

  web:
    resources:
      chain:
        strategy:
          content:
            enabled: true
            paths: /**

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        missing-queues-fatal: false

mybatis:
  mapper-locations: classpath:mappers/**/*.xml
  type-aliases-package: com.example.smartmessaging.dto
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: info
    com.example.smartmessaging.mapper: trace

server:
  port: 8080

solapi:
  enabled: false
  api-key: ${SOLAPI_API_KEY:}
  api-secret: ${SOLAPI_API_SECRET:}
  from-number: ${SOLAPI_FROM_NUMBER:}

messaging:
  unsubscribe-url: ${MESSAGING_UNSUBSCRIBE_URL:}
  email:
    dummy-enabled: ${MESSAGING_EMAIL_DUMMY_ENABLED:false}
  kakao:
    dummy-enabled: ${MESSAGING_KAKAO_DUMMY_ENABLED:false}
