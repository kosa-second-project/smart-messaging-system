<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 메시징 시스템</title>
    
    <!-- 1. 로그인 전용 단독 스타일시트 연동 (CSS 로드 차단 방지) -->
    <link rel="stylesheet" th:href="@{/css/pages/login.css}">
    
    <!-- 2. Google Fonts 계열 폰트 임포트 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
</head>
<body class="login-body">

<div class="login-container">
    
    <!-- 헤더 영역 (기존 데모 사이트 브랜딩 100% 동기화) -->
    <div class="login-header">
        <div class="login-logo-container">
            <div class="login-logo-icon">
                <!-- 메시지 스퀘어 아이콘 SVG (lucide MessageSquare 대응) -->
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
            </div>
            <span class="login-logo-text">메시징 시스템</span>
        </div>
<!--        <p class="login-subtitle">운영자 계정으로 로그인하세요</p>-->
    </div>

    <div class="login-card">
        
        <!-- 1. 실패 에러 메시지 알림 박스 -->
        <div class="alert-box alert-danger" th:if="${errorMessage}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span th:text="${errorMessage}">오류 메시지 내용</span>
        </div>

        <!-- 2. 로그아웃 완료 성공 메시지 알림 박스 -->
        <div class="alert-box alert-success" th:if="${logoutMessage}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
            <span th:text="${logoutMessage}">로그아웃 성공 안내</span>
        </div>

        <!-- 실제 로그인 폼 양식 (SecurityConfig 지정된 /auth/login-proc 매핑) -->
        <form th:action="@{/auth/login-proc}" method="POST" id="loginForm">
            
            <!-- 사원번호(ID) 입력창 -->
            <div class="form-group">
                <label class="form-label">ID (사원번호)</label>
                <div class="input-container">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </span>
                    <input type="text" class="login-input" name="empNum" placeholder="사원번호를 입력하세요" required autocomplete="username" id="empNumInput">
                </div>
            </div>

            <!-- 비밀번호 입력창 -->
            <div class="form-group">
                <label class="form-label">비밀번호</label>
                <div class="input-container">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </span>
                    <input type="password" class="login-input" name="password" placeholder="비밀번호를 입력하세요" required autocomplete="current-password" id="passwordInput">
                    <!-- 보이기/숨기기 토글 버튼 -->
                    <button type="button" class="password-toggle" id="passwordToggle">
                        <svg id="eyeOpenIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg id="eyeClosedIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- 로그인 실행 버튼 -->
            <button type="submit" class="login-btn">
                로그인
            </button>
        </form>
    </div>

    <!-- 푸터 라이센스 표기 -->
    <div class="login-footer">
        ⓒ 2026 Messaging System. All rights reserved.
    </div>
</div>

<!-- 비밀번호 토글 및 클라이언트 유효성 검증용 자바스크립트 내장 -->
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const passwordInput = document.getElementById("passwordInput");
        const passwordToggle = document.getElementById("passwordToggle");
        const eyeOpenIcon = document.getElementById("eyeOpenIcon");
        const eyeClosedIcon = document.getElementById("eyeClosedIcon");
        const empNumInput = document.getElementById("empNumInput");

        // 1. 비밀번호 보이기/숨기기 기능 토글
        passwordToggle.addEventListener("click", function() {
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                eyeOpenIcon.style.display = "none";
                eyeClosedIcon.style.display = "block";
            } else {
                passwordInput.type = "password";
                eyeOpenIcon.style.display = "block";
                eyeClosedIcon.style.display = "none";
            }
        });

        // 2. 사원번호 숫자 입력 제한 (문자 차단)
        empNumInput.addEventListener("input", function(e) {
            this.value = this.value.replace(/[^0-9]/g, '');
        });
    });
</script>

</body>
</html>
