<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<header th:fragment="headerFragment" class="app-header">
    <div class="app-header__left">
        <button type="button" class="ds-icon-button d-lg-none" data-sidebar-open aria-label="메뉴 열기">
            <span aria-hidden="true">☰</span>
        </button>
        <h1 class="app-header__title" th:text="${pageTitle ?: '스마트 메시징 시스템'}">스마트 메시징 시스템</h1>
    </div>

    <div class="app-header__right">
        <div class="app-profile" data-profile-menu>
            <button type="button"
                    class="app-profile__trigger"
                    data-profile-toggle
                    aria-haspopup="true"
                    aria-expanded="false">
                <span class="app-header__avatar"
                      th:text="${#authentication?.principal?.name != null ? #strings.substring(#authentication.principal.name, 0, 1) : 'U'}">U</span>
                <span class="app-profile__identity">
                    <span class="app-profile__label">로그인 사용자</span>
                    <span class="app-profile__name"
                          th:text="${#authentication?.principal?.name ?: #authentication?.name ?: '사용자'}">사용자</span>
                </span>
                <span class="app-profile__chevron" aria-hidden="true">▾</span>
            </button>

            <div class="app-profile__menu" data-profile-panel>
                <div class="app-profile__summary">
                    <span class="app-header__avatar app-header__avatar--large"
                          th:text="${#authentication?.principal?.name != null ? #strings.substring(#authentication.principal.name, 0, 1) : 'U'}">U</span>
                    <div class="app-profile__summary-text">
                        <strong th:text="${#authentication?.principal?.name ?: #authentication?.name ?: '사용자'}">사용자</strong>
                        <span th:text="${#authentication?.name}">user</span>
                    </div>
                </div>

                <div class="app-profile__section">
                    <a th:if="${session.kakaoAccessToken == null}"
                       th:href="@{/kakao/login}"
                       class="app-profile__menu-item app-profile__menu-item--kakao">
                        <span class="app-profile__menu-icon app-header__avatar--unlinked">K</span>
                        <span>
                            <strong>카카오 API 연동</strong>
                            <small>시연 전 한 번만 연결</small>
                        </span>
                    </a>
                    <div th:if="${session.kakaoAccessToken != null}"
                         class="app-profile__menu-item app-profile__menu-item--readonly">
                        <span class="app-profile__menu-icon app-header__avatar--linked">K</span>
                        <span>
                            <strong>카카오 연동 완료</strong>
                            <small>테스트 발송 사용 가능</small>
                        </span>
                    </div>
                </div>

                <a th:href="@{/auth/logout}" class="app-profile__logout">로그아웃</a>
            </div>
        </div>
    </div>
</header>
</html>
