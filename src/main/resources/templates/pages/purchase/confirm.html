<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>특별 혜택 구매 안내</title>
    <link rel="stylesheet" th:href="@{/css/pages/purchase.css}">
</head>
<body>
<main class="purchase-page">
    <section class="purchase-card">
        <span class="purchase-badge">Special Gift</span>
        <h1 class="purchase-title">
            <span class="purchase-highlight" th:text="${customerName} ?: '고객'">고객</span>님만을 위한<br>특별 혜택이 도착했습니다!
        </h1>
        <p class="purchase-description">
            준비된 한정 수량 혜택입니다.<br>아래 버튼을 눌러 구매 절차를 시작하세요.
        </p>

        <div class="customer-info-box">
            <div class="customer-info-row">
                <span class="customer-info-label">수신 고객명</span>
                <span class="customer-info-val" th:text="${customerName} ?: '고객'">홍길동</span>
            </div>
            <div class="customer-info-row">
                <span class="customer-info-label">휴대폰 번호</span>
                <span class="customer-info-val" th:text="${phone} ?: '-'">010-****-0000</span>
            </div>
        </div>

        <form id="purchaseForm" th:action="@{'/p/' + ${code} + '/purchase'}" method="post">
            <button type="button" class="purchase-button" onclick="openPurchaseModal()">구매하러 가기</button>
        </form>
        
        <p class="purchase-footer">본 링크는 수신자 본인만 이용 가능한 일회성 주소입니다.</p>
    </section>
</main>

<!-- 커스텀 구매 컨펌 모달 -->
<div id="purchaseConfirmModal" class="custom-modal">
    <div class="custom-modal__backdrop" onclick="closePurchaseModal()"></div>
    <div class="custom-modal__panel">
        <span class="custom-modal__icon">🎁</span>
        <h3 class="custom-modal__title">구매를 진행하시겠습니까?</h3>
        <p class="custom-modal__message">
            확인 버튼을 누르시면 특별 혜택 구매 신청이 완료됩니다.
        </p>
        <div class="custom-modal__actions">
            <button type="button" class="custom-modal__btn custom-modal__btn--cancel" onclick="closePurchaseModal()">취소</button>
            <button type="button" class="custom-modal__btn custom-modal__btn--confirm" onclick="submitPurchaseForm()">확인</button>
        </div>
    </div>
</div>

<script>
    function openPurchaseModal() {
        document.getElementById('purchaseConfirmModal').classList.add('is-open');
        document.body.classList.add('modal-open');
    }

    function closePurchaseModal() {
        document.getElementById('purchaseConfirmModal').classList.remove('is-open');
        document.body.classList.remove('modal-open');
    }

    function submitPurchaseForm() {
        document.getElementById('purchaseConfirmModal').classList.remove('is-open');
        document.body.classList.remove('modal-open');
        document.getElementById('purchaseForm').submit();
    }
</script>
</body>
</html>
