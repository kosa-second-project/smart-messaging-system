plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}



configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Web & Thymeleaf
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect' // 레이아웃 상속(Decorator)을 위한 데코레이터 라이브러리

    
    // Security
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6' // Thymeleaf에서 Security 표현식 사용 지원

    // AOP (Aspect Oriented Programming - 공통 로깅)
    implementation 'org.springframework.boot:spring-boot-starter-aop'


    // Database & MyBatis
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'
    runtimeOnly 'com.oracle.database.jdbc:ojdbc11' // Oracle JDBC (JDK 17 호환)
    
    // Redis (RedisConfig 및 CampaignDraftService 컴파일용 필수 의존성 추가)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Developer Tools
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    
    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    // Validation (입력값 유효성 검증 - 이메일, 필수 입력 등 검증에 매우 유용하므로 추가 제안)
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // AWS SDK SES v2
    implementation platform('software.amazon.awssdk:bom:2.25.20')
    implementation 'software.amazon.awssdk:sesv2'

    // SOLAPI SDK for SMS/LMS
    implementation 'com.solapi:sdk:1.1.0'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
}

tasks.named('test') {
    useJUnitPlatform()
}
