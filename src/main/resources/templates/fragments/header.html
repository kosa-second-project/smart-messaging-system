<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<header th:fragment="headerFragment" class="app-header">
    <div class="app-header__left">
        <button type="button" class="ds-icon-button d-lg-none" data-sidebar-open aria-label="메뉴 열기">
            <span aria-hidden="true">☰</span>
        </button>
        <h1 class="app-header__title" th:text="${pageTitle ?: '스마트 메시징 시스템'}">스마트 메시징 시스템</h1>
    </div>
    <div class="app-header__right" th:with="displayName=${#authentication?.principal?.name ?: '사용자'}">
        <a th:href="@{/kakao/login}"
           class="app-header__profile-link no-underline-link"
           title="카카오 로그인 연동"
           aria-label="카카오 로그인 연동">
            <img class="app-header__profile-image"
                 th:src="@{/images/default-profile.svg}"
                 alt="프로필 사진">
        </a>
        <span class="app-header__profile-name d-none d-sm-inline" th:text="${displayName}">사용자</span>
        <a th:href="@{/auth/logout}" class="ds-button ds-button--outline ds-button--sm">로그아웃</a>
    </div>
</header>
</html>
