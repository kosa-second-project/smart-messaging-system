<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="headFragment(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Spring Security CSRF Meta Tags (비동기 통신 자동 인증 바인딩용) -->
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>
    
    <title th:text="${(pageTitle ?: '스마트 메시징 시스템') + ' - 스마트 메시징 시스템'}">스마트 메시징 시스템</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="shortcut icon" th:href="@{/favicon.svg}">
    
    <!-- 1. 외부 라이브러리 CSS (우선 CDN 선언, 로컬 라이브러리 교체 가능) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 로컬 경로 교체 시: <link rel="stylesheet" th:href="@{/css/lib/bootstrap.min.css}"> -->
    
    <!-- 2. 공통 디자인 시스템 CSS -->
    <link rel="stylesheet" th:href="@{/css/common/variables.css}">
    <link rel="stylesheet" th:href="@{/css/common/reset.css}">
    <link rel="stylesheet" th:href="@{/css/common/layout.css}">
    <link rel="stylesheet" th:href="@{/css/common/components/button.css}">
    <link rel="stylesheet" th:href="@{/css/common/components/card.css}">
    <link rel="stylesheet" th:href="@{/css/common/components/stat-card.css}">
    <link rel="stylesheet" th:href="@{/css/common/components/form.css}">
    <link rel="stylesheet" th:href="@{/css/common/components/badge.css}">
    <link rel="stylesheet" th:href="@{/css/common/components/table.css}">
    <link rel="stylesheet" th:href="@{/css/common/components/tabs.css}">
    <link rel="stylesheet" th:href="@{/css/common/components/modal.css}">
    <link rel="stylesheet" th:href="@{/css/common/components/message-preview.css}">
    <link rel="stylesheet" th:href="@{/css/pages/stats-delivery.css}">
    <link rel="stylesheet" th:href="@{/css/pages/stats-channel.css}">
    <link rel="stylesheet" th:href="@{/css/pages/stats-analysis.css}">
    
    <!-- 3. 외부 라이브러리 JS (우선 CDN 선언, 로컬 라이브러리 교체 가능) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/bundle/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <!-- 로컬 경로 교체 시:
    <script th:src="@{/js/lib/jquery-3.7.1.min.js}"></script>
    <script th:src="@{/js/lib/bootstrap.bundle.min.js}"></script>
    -->
    
    <!-- 4. 공통 자바스크립트 모듈 -->
    <script th:src="@{/js/common/api-client.js}"></script>
    <script th:src="@{/js/common/ui.js}"></script>
    <script th:src="@{/js/common/utils.js}"></script>
    <script th:src="@{/js/common/stats-chart.js}"></script>
    <script th:src="@{/js/common/report-renderer.js}"></script>
</head>
</html>
