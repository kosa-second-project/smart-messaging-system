<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/send-layout}">
<head>
    <link rel="stylesheet" th:href="@{/css/pages/send/message.css(v=${#dates.createNow().getTime()})}">
</head>
<body>
<div layout:fragment="send-content">
    <div class="message-step-container">
        <div class="top-cards-grid top-cards-grid--message">
            <div class="routing-section ds-card">
                <div class="section-header ds-card__header message-card-header">
                    <div class="message-header">
                        <h3 class="ds-card__title">채널 발송 우선순위</h3>
                        <p class="section-desc">가능한 채널 중 먼저 시도할 순서를 정합니다.</p>
                    </div>
                    <button type="button" class="ds-button ds-button--sm ds-button--outline btn-smart-sort" id="btnSmartSort">최저가 자동정렬</button>
                </div>
                <div class="ds-card__body">
                    <ul class="channel-list" id="channelSortableList"></ul>
                </div>
            </div>
        </div>

        <div class="message-composer-grid">
            <div class="template-search-section ds-card composer-column">
                <div class="template-search-header ds-card__header">
                    <div class="ds-card__title">템플릿 검색</div>
                </div>
                <div class="template-search-body ds-card__body template-body">
                    <div class="template-search-box">
                        <div class="search-input-wrapper">
                            <input type="text" id="templateSearchInput" class="ds-input" placeholder="템플릿명, 채널, 문구 검색">
                        </div>
                        <div class="filter-dropdowns">
                            <select class="ds-select filter-select" id="templateCategorySelect" aria-label="템플릿 카테고리">
                                <option value="">전체 카테고리</option>
                            </select>
                            <select class="ds-select filter-select" id="templateChannelSelect" aria-label="템플릿 채널">
                                <option value="">전체 채널</option>
                            </select>
                        </div>
                        <div class="filter-tags" id="templateCategoryTags"></div>

                        <div class="selected-template-alert is-hidden" id="selectedTemplateAlert">
                            <div class="alert-title">선택한 템플릿</div>
                            <div class="alert-content" id="selectedTemplateName">선택한 템플릿이 없습니다.</div>
                            <div class="alert-preview" id="selectedTemplatePreview"></div>
                        </div>

                        <div class="template-list-container"></div>
                        <div class="template-search-footer">0건 검색됨</div>
                    </div>
                </div>
            </div>

            <div class="input-section ds-card composer-column">
                <div class="section-header ds-card__header">
                    <div class="message-header">
                        <h3 class="ds-card__title">메시지 내용 작성</h3>
                    </div>
                    <div class="message-header-actions">
                        <div class="link-dropdown">
                            <button type="button" class="ds-button ds-button--sm ds-button--outline" id="btnToggleLinkSettings" aria-expanded="false" aria-controls="linkSettingsPanel">
                                링크 설정
                            </button>
                            <div class="link-settings-wrapper" id="linkSettingsPanel">
                                <div class="link-settings-header">
                                    <label class="message-label">링크 삽입</label>
                                    <div class="link-purpose-toggle" id="linkPurposeToggle" aria-label="링크 목적">
                                        <button type="button" class="link-purpose-btn active" data-purpose="CLICK">클릭</button>
                                        <button type="button" class="link-purpose-btn" data-purpose="PURCHASE">구매</button>
                                    </div>
                                </div>
                                <div class="input-wrapper">
                                    <label for="linkButtonName" class="message-label">버튼명</label>
                                    <input type="text" id="linkButtonName" class="ds-input message-title-input" placeholder="자세히 보기" maxlength="40">
                                </div>
                                <div class="input-wrapper">
                                    <label for="linkUrl" class="message-label">링크 URL</label>
                                    <input type="url" id="linkUrl" class="ds-input message-title-input" placeholder="https://example.com/event" maxlength="2048">
                                </div>
                                <p class="link-settings-help">실제 발송 시 고객별 추적 링크로 변환됩니다.</p>
                                <div class="link-settings-actions">
                                    <button type="button" class="ds-button ds-button--sm ds-button--outline" id="btnCancelLinkSettings">취소</button>
                                    <button type="button" class="ds-button ds-button--sm ds-button--primary" id="btnApplyLinkSettings">확인</button>
                                </div>
                            </div>
                        </div>
                        <button type="button" class="ds-button ds-button--sm ds-button--outline" id="btnSendTestMessage">테스트 발송</button>
                        <button type="button" class="ds-button ds-button--sm ds-button--outline" id="btnSaveTemplate">템플릿 저장</button>
                    </div>
                </div>

                <div class="ds-card__body template-body">
                    <div class="message-purpose-wrapper">
                        <label class="message-label">광고 여부</label>
                        <div class="purpose-toggle-group" id="messagePurposeToggle"></div>
                        <p class="message-purpose-notice" id="messagePurposeNotice"></p>
                    </div>

                    <div class="personalization-wrapper">
                        <label class="message-label">개인화 항목</label>
                        <div class="personalization-tags">
                            <button type="button" class="ds-button ds-button--sm ds-button--outline tag-btn js-insert-variable" data-variable="#{고객명}">고객명</button>
                            <button type="button" class="ds-button ds-button--sm ds-button--outline tag-btn" data-variable="#{주문번호}" disabled aria-disabled="true">주문번호</button>
                            <button type="button" class="ds-button ds-button--sm ds-button--outline tag-btn" data-variable="#{쿠폰명}" disabled aria-disabled="true">쿠폰명</button>
                        </div>
                    </div>

                    <div class="input-wrapper">
                        <label for="messageTitle" class="message-label">제목</label>
                        <input type="text" id="messageTitle" class="ds-input message-title-input" placeholder="메시지 제목" maxlength="50">
                    </div>

                    <div class="textarea-wrapper">
                        <label for="messageContent" class="message-label">내용</label>
                        <textarea id="messageContent" class="ds-textarea message-textarea" placeholder="발송할 메시지 내용을 입력해주세요." maxlength="1000"></textarea>
                        <div class="byte-counter">
                            <span id="currentBytes">0</span> / <span id="maxBytes">최대 90byte</span>
                            <span class="msg-type-badge ds-badge ds-badge--primary" id="msgTypeBadge">SMS</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="preview-section ds-card composer-column">
                <div class="ds-card__header preview-header">
                    <h3 class="ds-card__title">미리보기</h3>
                    <div class="preview-tabs">
                        <button type="button" class="preview-tab-btn active" data-target="sms">메시지</button>
                        <button type="button" class="preview-tab-btn" data-target="kakao">카카오톡</button>
                        <button type="button" class="preview-tab-btn" data-target="email">이메일</button>
                    </div>
                </div>
                <div class="preview-ad-badge-row">
                    <span class="preview-ad-badge">광고성</span>
                </div>
                <div class="ds-card__body preview-body-container">
                    <div th:replace="~{fragments/components/message-preview :: preview}"></div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/pages/send-message.js(v=${#dates.createNow().getTime()})}"></script>
</div>
</body>
</html>
